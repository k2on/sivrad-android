name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: nix build .#apk
    runs-on: ubuntu-latest
    steps:
      # No submodule checkout: Nix takes llama.cpp from flake.lock (the
      # `llama-cpp` input), pinned to the same commit as the submodule.
      - uses: actions/checkout@v4

      # The SDK + NDK, a writable copy of them, and Gradle's state layer do
      # not fit in the runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build debug APK
        run: nix build .#apk -L --print-out-paths

      - uses: actions/upload-artifact@v4
        with:
          name: sivrad-debug-apk
          path: result/*.apk
          if-no-files-found: error

  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: llama.cpp submodule and flake input agree
        run: |
          submodule=$(git ls-tree HEAD core/llm/src/main/cpp/llama.cpp | awk '{print $3}')
          locked=$(jq -r '.nodes["llama-cpp"].locked.rev' flake.lock)
          echo "submodule: $submodule"
          echo "flake.lock: $locked"
          test "$submodule" = "$locked"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix flake check
        run: nix flake check -L
